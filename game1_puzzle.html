    <title>记忆拼图 · 我们的故事</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: manipulation;
        }
        .container {
            width: 90vw;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
        }
        .header {
            text-align: center;
            color: #c0392b;
        }
        .header h1 {
            font-size: 24px;
            margin-bottom: 6px;
            text-shadow: 0 2px 4px rgba(192, 57, 43, 0.2);
        }
        .header p {
            font-size: 14px;
            color: #e74c3c;
            opacity: 0.8;
        }
        .puzzle-wrapper {
            position: relative;
            width: 90vw;
            height: 90vw;
            max-width: 400px;
            max-height: 400px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            padding: 8px;
            box-shadow: 0 8px 32px rgba(231, 76, 60, 0.2);
            backdrop-filter: blur(10px);
        }
        .puzzle {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 100%;
            height: 100%;
            gap: 4px;
            position: relative;
        }
        .tile {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .tile.blank {
            background: rgba(255, 255, 255, 0.3);
            border: 2px dashed rgba(231, 76, 60, 0.3);
            cursor: default;
        }
        .tile:active:not(.blank) {
            transform: scale(0.95);
        }
        .tile-number {
            position: absolute;
            top: 4px;
            left: 4px;
            background: rgba(255,255,255,0.7);
            color: #c0392b;
            font-size: 12px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            opacity: 0.6;
            pointer-events: none;
        }
        .controls {
            display: flex;
            gap: 12px;
        }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            font-weight: 600;
        }
        .btn-primary {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            box-shadow: 0 4px 16px rgba(231, 76, 60, 0.3);
        }
        .btn-primary:active {
            transform: translateY(2px);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.6);
            color: #c0392b;
            border: 1px solid rgba(231, 76, 60, 0.3);
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .overlay.show {
            display: flex;
            opacity: 1;
        }
        .surprise-card {
            background: linear-gradient(135deg, #fff5f5, #ffe0e0);
            border-radius: 24px;
            padding: 36px 28px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(192, 57, 43, 0.3);
            transform: scale(0.8);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }
        .overlay.show .surprise-card {
            transform: scale(1);
        }
        .surprise-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 70%);
            animation: shimmer 3s infinite;
        }
        @keyframes shimmer {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .heart-animation {
            font-size: 48px;
            margin-bottom: 16px;
            animation: heartbeat 1.2s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(1); }
            75% { transform: scale(1.15); }
        }
        .surprise-title {
            font-size: 22px;
            color: #c0392b;
            margin-bottom: 16px;
            font-weight: bold;
            position: relative;
            z-index: 1;
        }
        .surprise-text {
            font-size: 16px;
            color: #555;
            line-height: 1.8;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }
        .surprise-days {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            padding: 12px 20px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 20px;
            display: inline-block;
            position: relative;
            z-index: 1;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
        }
        .next-hint {
            font-size: 13px;
            color: #888;
            margin-top: 8px;
            position: relative;
            z-index: 1;
        }
        .qr-placeholder {
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 12px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #e74c3c;
            color: #e74c3c;
            font-size: 12px;
            position: relative;
            z-index: 1;
        }
        .progress {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(231, 76, 60, 0.3);
        }
        .dot.active {
            background: #e74c3c;
            box-shadow: 0 0 8px rgba(231, 76, 60, 0.5);
        }
        .hint {
            font-size: 12px;
            color: #c0392b;
            opacity: 0.7;
            margin-top: 4px;
        }
        /* 花瓣飘落效果 */
        .petal {
            position: fixed;
            top: -10px;
            font-size: 20px;
            animation: fall linear forwards;
            pointer-events: none;
            z-index: 999;
        }
        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧩 记忆拼图 · 我们的故事</h1>
            <p>把碎片拼成完整的我们</p>
        </div>

        <div class="puzzle-wrapper">
            <div class="puzzle" id="puzzle"></div>
        </div>

        <div class="progress">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <div class="hint">完成拼图，解锁惊喜</div>

        <div class="controls">
            <button class="btn btn-secondary" onclick="shuffle()">🔀 打乱重试</button>
            <button class="btn btn-primary" onclick="showHint()">💡 提示一下</button>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="surprise-card">
            <div class="heart-animation">💍</div>
            <div class="surprise-title">拼图完成！</div>
            <div class="surprise-text">
                从相遇的那一刻起，我就知道，<br>
                余生只想和你一起走。
            </div>
            <div class="surprise-days">❤️ 这是我们在一起的第 730 天 ❤️</div>
            <a href="game2_catch.html" style="text-decoration:none;">
                <button class="btn btn-primary" style="margin-top:12px;padding:12px 32px;font-size:15px;border:none;border-radius:24px;background:linear-gradient(135deg,#e74c3c,#c0392b);color:white;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(231,76,60,0.3);">💕 继续第二关</button>
            </a>
            <div class="next-hint" style="margin-top:10px;">点击按钮，继续我们的旅程 →</div>
        </div>
    </div>

    <script>
        const puzzle = document.getElementById('puzzle');
        const overlay = document.getElementById('overlay');
        const SIZE = 3;
        const TOTAL = SIZE * SIZE;
        let state = []; // 当前每个位置放的tile index
        let blankPos = 8; // 空白块当前位置
        let isComplete = false;

        // 背景位置映射 (col%, row%)
        const bgPositions = [
            '0% 0%', '50% 0%', '100% 0%',
            '0% 50%', '50% 50%', '100% 50%',
            '0% 100%', '50% 100%', '100% 100%'
        ];

        // 初始化
        function init() {
            puzzle.innerHTML = '';
            state = Array.from({length: TOTAL}, (_, i) => i);

            for (let i = 0; i < TOTAL; i++) {
                const tile = document.createElement('div');
                tile.className = 'tile' + (i === 8 ? ' blank' : '');
                tile.id = 'tile-' + i;

                if (i !== 8) {
                    tile.style.backgroundPosition = bgPositions[i];
                    const num = document.createElement('span');
                    num.className = 'tile-number';
                    num.textContent = i + 1;
                    tile.appendChild(num);
                }

                tile.addEventListener('click', () => handleTileClick(i));
                puzzle.appendChild(tile);
            }

            updatePositions();
            setTimeout(() => shuffle(), 500);
        }

        // 更新所有tile的位置（通过改变grid-row/grid-column）
        function updatePositions() {
            for (let pos = 0; pos < TOTAL; pos++) {
                const tileIndex = state[pos];
                const tile = document.getElementById('tile-' + tileIndex);
                const row = Math.floor(pos / SIZE) + 1;
                const col = (pos % SIZE) + 1;
                tile.style.gridRow = row;
                tile.style.gridColumn = col;
            }
            blankPos = state.indexOf(8);
        }

        // 获取相邻位置
        function getNeighbors(pos) {
            const row = Math.floor(pos / SIZE);
            const col = pos % SIZE;
            const neighbors = [];
            if (row > 0) neighbors.push(pos - SIZE); // 上
            if (row < SIZE - 1) neighbors.push(pos + SIZE); // 下
            if (col > 0) neighbors.push(pos - 1); // 左
            if (col < SIZE - 1) neighbors.push(pos + 1); // 右
            return neighbors;
        }

        // 处理点击
        function handleTileClick(tileIndex) {
            if (isComplete) return;
            const pos = state.indexOf(tileIndex);
            const neighbors = getNeighbors(blankPos);

            if (neighbors.includes(pos)) {
                // 交换
                [state[pos], state[blankPos]] = [state[blankPos], state[pos]];
                updatePositions();
                checkWin();
            }
        }

        // 打乱（确保可解：从完成状态随机移动空白块）
        function shuffle() {
            isComplete = false;
            overlay.classList.remove('show');
            state = Array.from({length: TOTAL}, (_, i) => i);
            blankPos = 8;

            let lastPos = -1;
            const steps = 120; // 随机移动步数

            for (let i = 0; i < steps; i++) {
                const neighbors = getNeighbors(blankPos);
                // 避免来回移动
                const validNeighbors = neighbors.filter(n => n !== lastPos);
                const nextPos = validNeighbors.length > 0 
                    ? validNeighbors[Math.floor(Math.random() * validNeighbors.length)]
                    : neighbors[Math.floor(Math.random() * neighbors.length)];

                [state[blankPos], state[nextPos]] = [state[nextPos], state[blankPos]];
                lastPos = blankPos;
                blankPos = nextPos;
            }

            updatePositions();
        }

        // 检测胜利
        function checkWin() {
            const won = state.every((val, idx) => val === idx);
            if (won && !isComplete) {
                isComplete = true;
                setTimeout(() => {
                    showSurprise();
                }, 300);
            }
        }

        // 显示惊喜
        function showSurprise() {
            overlay.classList.add('show');
            createPetals();
        }

        // 提示功能：高亮一个正确位置的tile
        function showHint() {
            if (isComplete) return;
            for (let pos = 0; pos < TOTAL; pos++) {
                if (state[pos] !== pos && state[pos] !== 8) {
                    const tile = document.getElementById('tile-' + state[pos]);
                    tile.style.boxShadow = '0 0 20px rgba(231, 76, 60, 0.8)';
                    setTimeout(() => {
                        tile.style.boxShadow = '0 2px 8px rgba(0,0,0,0.1)';
                    }, 1000);
                    break;
                }
            }
        }

        // 花瓣飘落
        function createPetals() {
            const petals = ['🌸', '💮', '🏵️', '💐', '🌺'];
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const petal = document.createElement('div');
                    petal.className = 'petal';
                    petal.textContent = petals[Math.floor(Math.random() * petals.length)];
                    petal.style.left = Math.random() * 100 + 'vw';
                    petal.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    petal.style.fontSize = (Math.random() * 16 + 14) + 'px';
                    document.body.appendChild(petal);
                    setTimeout(() => petal.remove(), 5000);
                }, i * 200);
            }
        }

        // 启动
        init();
    </script>
</body>
</html>

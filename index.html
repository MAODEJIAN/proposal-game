<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>💍 给我们的求婚游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a0a2e 0%, #4a1a6b 30%, #e91e63 70%, #ff6b6b 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            touch-action: manipulation;
        }
        .container {
            text-align: center;
            max-width: 420px;
            width: 100%;
            animation: fadeInUp 1s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .ring-icon {
            font-size: 64px;
            margin-bottom: 16px;
            animation: ringPulse 2s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.5));
        }
        @keyframes ringPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        h1 {
            font-size: 28px;
            color: #fff;
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .subtitle {
            font-size: 15px;
            color: rgba(255,255,255,0.8);
            margin-bottom: 36px;
            line-height: 1.6;
        }
        .stage-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 32px;
        }
        .stage-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s;
            text-align: left;
        }
        .stage-card:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateX(6px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .stage-num {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #4a1a6b;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
        }
        .stage-info h3 {
            font-size: 16px;
            margin-bottom: 2px;
        }
        .stage-info p {
            font-size: 12px;
            color: rgba(255,255,255,0.7);
        }
        .start-btn {
            display: inline-block;
            padding: 16px 48px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #4a1a6b;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 6px 24px rgba(255, 215, 0, 0.4);
            transition: all 0.3s;
            animation: breathe 2s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { box-shadow: 0 6px 24px rgba(255, 215, 0, 0.4); }
            50% { box-shadow: 0 6px 36px rgba(255, 215, 0, 0.7); }
        }
        .start-btn:active {
            transform: scale(0.95);
        }
        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
        }
        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .heart-float {
            position: absolute;
            font-size: 20px;
            animation: floatUp 8s linear infinite;
            opacity: 0.3;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>

    <div class="container">
        <div class="ring-icon">💍</div>
        <h1>给我们的求婚游戏</h1>
        <p class="subtitle">
            三道关卡，层层递进<br>
            只有你才能解锁的最终惊喜
        </p>

        <div class="stage-list">
            <div class="stage-card">
                <div class="stage-num">1</div>
                <div class="stage-info">
                    <h3>🧩 记忆拼图 · 我们的故事</h3>
                    <p>把碎片拼成完整的我们</p>
                </div>
            </div>
            <div class="stage-card">
                <div class="stage-num">2</div>
                <div class="stage-info">
                    <h3>💝 接爱心 · 心跳频率</h3>
                    <p>接住我所有的爱</p>
                </div>
            </div>
            <div class="stage-card">
                <div class="stage-num">3</div>
                <div class="stage-info">
                    <h3>🔐 爱的密码 · 专属问答</h3>
                    <p>只有我们才懂的答案</p>
                </div>
            </div>
        </div>

        <a href="game1_puzzle.html" class="start-btn">💕 开始游戏</a>

        <p class="footer">❤️ 噜噜大王 × 噜噜公主 ❤️</p>
    </div>

    <script>
        // 背景漂浮爱心
        const heartsContainer = document.getElementById('hearts');
        const heartEmojis = ['❤️', '💕', '💖', '💗', '💓', '🌸'];
        for (let i = 0; i < 15; i++) {
            const h = document.createElement('div');
            h.className = 'heart-float';
            h.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            h.style.left = Math.random() * 100 + '%';
            h.style.animationDuration = (Math.random() * 6 + 6) + 's';
            h.style.animationDelay = (Math.random() * 5) + 's';
            h.style.fontSize = (Math.random() * 16 + 14) + 'px';
            heartsContainer.appendChild(h);
        }
    </script>
</body>
</html>
